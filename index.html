<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f0f0f">
<title>Inventario de repuestos KERALTY</title>
<style>
  /* =====================================================
     COLORES Y MEDIDAS  ->  cambia aqui el aspecto general
     ===================================================== */
  :root{
    --accent:#3b82f6;          /* color principal (morado) */
    --accent-soft:rgba(176,79,163,.16);
    --bg:#0e0e11;              /* fondo de la pagina */
    --card:#17171c;            /* fondo de las tarjetas */
    --input:#23232a;           /* fondo del buscador */
    --line:#2f2f38;            /* lineas y bordes */
    --text:#f4f4f6;            /* texto principal */
    --muted:#9a9aa6;           /* texto secundario */
    --ok:#3ecf8e; --warn:#f5b53d; --bad:#ef5b5b;   /* stock: normal, bajo, agotado */
    --radius:16px;             /* redondeo de las tarjetas */
    --max:760px;               /* ancho maximo del contenido */
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f5f4f7;--card:#ffffff;--input:#ffffff;--line:#e3e1e8;--text:#1b1b20;--muted:#6b6b78;--accent-soft:rgba(176,79,163,.12)}
    .photo{box-shadow:0 0 0 1px var(--line)}
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       background-image:radial-gradient(900px 340px at 50% -120px,var(--accent-soft),transparent)}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 16px 40px}

  header{padding:28px 0 14px}
  h1{margin:0;font-size:24px;line-height:1.15;letter-spacing:-.01em}
  h1 span{color:var(--accent)}
  .sub{margin:6px 0 0;color:var(--muted);font-size:14px}

  .searchbar{position:sticky;top:0;z-index:5;padding:10px 0 12px;background:linear-gradient(var(--bg) 75%,transparent)}
  .field{position:relative}
  .field svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
  input[type=search]{width:100%;height:52px;padding:0 44px 0 44px;font-size:16px;color:var(--text);background:var(--input);
       border:1px solid var(--line);border-radius:14px;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .15s,box-shadow .15s}
  input[type=search]::-webkit-search-cancel-button{display:none}
  input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  #clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;
       background:var(--line);color:var(--text);font-size:18px;line-height:1;cursor:pointer;display:none}
  .hint{margin:8px 2px 0;font-size:12px;color:var(--muted)}
  .meta{margin:4px 2px 12px;font-size:13px;color:var(--muted);min-height:18px}

  .empty{text-align:center;color:var(--muted);padding:44px 12px}
  .empty .ico{font-size:34px;display:block;margin-bottom:8px;opacity:.8}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;
        animation:in .22s ease both}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .head{display:flex;gap:14px;align-items:center}
  .photo{flex:none;width:96px;height:96px;border-radius:12px;background:#fff;object-fit:contain;cursor:zoom-in}
  .photo.none{cursor:default;object-fit:cover}
  .info{min-width:0;flex:1}
  .name{margin:0 0 8px;font-size:17px;line-height:1.25;font-weight:700;word-break:break-word}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--text);word-break:break-all}
  .chip i{font-style:normal;color:var(--muted);margin-right:4px}

  .stock{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;font-weight:700}
  .stock::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
  .stock small{font-weight:500;color:var(--muted);font-size:12px}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .grid .full{grid-column:1/-1}
  .k{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .v{font-weight:600;font-size:15px;word-break:break-word}
  .obs{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:13px}
  .obs b{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;font-weight:600}

  mark{background:rgba(245,181,61,.35);color:inherit;border-radius:3px;padding:0 1px}

  .sk{height:150px;border-radius:var(--radius);margin-bottom:14px;background:linear-gradient(90deg,var(--card) 25%,var(--line) 50%,var(--card) 75%);
      background-size:200% 100%;animation:sh 1.2s linear infinite}
  @keyframes sh{to{background-position:-200% 0}}

  footer{margin-top:22px;text-align:center;font-size:12px;color:var(--muted)}
  #top{position:fixed;right:16px;bottom:16px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);
       color:var(--text);font-size:18px;cursor:pointer;display:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}

  #zoom{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:16px;z-index:20;cursor:zoom-out}
  #zoom img{max-width:100%;max-height:100%;border-radius:10px;background:#fff}

  @media (min-width:600px){
    h1{font-size:30px}
    .photo{width:120px;height:120px}
    .grid{grid-template-columns:repeat(4,1fr)}
    .grid .full{grid-column:span 2}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="titulo"></h1>
    <p class="sub" id="subtitulo"></p>
  </header>

  <div class="searchbar">
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Buscar repuesto">
      <button id="clear" type="button" aria-label="Borrar búsqueda">×</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>

  <p class="meta" id="meta"></p>
  <div id="out"><div class="sk"></div><div class="sk"></div></div>
  <footer id="upd"></footer>
</div>
<button id="top" aria-label="Volver arriba">↑</button>
<div id="zoom"><img alt=""></div>

<script>
/* =====================================================
   TEXTOS Y OPCIONES  ->  cambia aqui lo que dice la pagina
   ===================================================== */
const CONFIG = {
  titulo: "Inventario de <span> KERALTY </span>",   // el <span> pinta la palabra con el color principal
  subtitulo: "Consulta de existencias y ubicación de repuestos",
  placeholder: "Nombre, número, ID o equipo.",
  ayuda: "Puedes buscar una palabra, un código incompleto o un equipo (ej. p 612, c 701).",
  stockBajo: 5,            // hasta esta cantidad se marca "Poco stock" (amarillo)
  refrescarMinutos: 5      // cada cuanto relee el inventario
};

/* ===================== LOGICA ===================== */
const $ = s => document.querySelector(s);
let items = [], words = [];

const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc  = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const txt  = v => (v === null || v === undefined) ? "" : String(v).trim();
const dash = v => txt(v) === "" ? "—" : txt(v);

/* Resalta en amarillo lo que coincide con la busqueda (ignora acentos y mayusculas) */
function hl(text){
  text = txt(text);
  if (!words.length) return esc(text);
  const ch = [...text], nc = ch.map(c => norm(c));
  if (nc.some(x => x.length !== 1)) return esc(text);
  const n = nc.join(""), on = new Array(ch.length).fill(false);
  for (const w of words){
    let i = n.indexOf(w);
    while (i !== -1){ for (let j = i; j < i + w.length; j++) on[j] = true; i = n.indexOf(w, i + 1); }
  }
  let out = "", open = false;
  ch.forEach((c, i) => {
    if (on[i] && !open){ out += "<mark>"; open = true; }
    if (!on[i] && open){ out += "</mark>"; open = false; }
    out += esc(c);
  });
  return out + (open ? "</mark>" : "");
}

function stock(v){
  if (txt(v) === "") return "";
  const n = Number(v);
  if (isNaN(n)) return `<div class="stock" style="--c:var(--muted)">${esc(txt(v))}</div>`;
  let c = "var(--ok)", t = "Disponible";
  if (n <= 0){ c = "var(--bad)"; t = "Agotado"; }
  else if (n <= CONFIG.stockBajo){ c = "var(--warn)"; t = "Poco stock"; }
  return `<div class="stock" style="--c:${c}">${n} ${n === 1 ? "unidad" : "unidades"} <small>· ${t}</small></div>`;
}

const NOFOTO = "data:image/svg+xml," + encodeURIComponent(
  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'><rect width='96' height='96' fill='#2a2a33'/>" +
  "<g fill='none' stroke='#6d6d7a' stroke-width='3' stroke-linejoin='round'><rect x='24' y='30' width='48' height='36' rx='5'/>" +
  "<circle cx='38' cy='43' r='4'/><path d='m26 62 14-12 10 8 8-6 14 10'/></g></svg>");

function card(it){
  const src = it.foto ? "fotos/" + encodeURIComponent(it.foto) : NOFOTO;
  const chips = [];
  if (txt(it.numero)) chips.push(`<span class="chip"><i>N.º</i>${hl(it.numero)}</span>`);
  if (txt(it.id))     chips.push(`<span class="chip"><i>ID</i>${hl(it.id)}</span>`);
  return `
  <article class="card">
    <div class="head">
      <img class="photo${it.foto ? "" : " none"}" src="${src}" data-full="${it.foto ? src : ""}" alt="" loading="lazy"
           onerror="this.onerror=null;this.src='${NOFOTO}';this.dataset.full='';this.classList.add('none')">
      <div class="info">
        <h2 class="name" style="font-size:17px">${hl(it.nombre)}</h2>
        <div class="chips">${chips.join("") || '<span class="chip"><i>Sin número ni ID</i></span>'}</div>
        ${stock(it.cantidad)}
      </div>
    </div>
    <div class="grid">
      <div class="full"><span class="k">Equipo</span><span class="v">${hl(dash(it.equipo))}</span></div>
      <div><span class="k">Closet</span><span class="v">${esc(dash(it.closet))}</span></div>
      <div><span class="k">Estante</span><span class="v">${esc(dash(it.estante))}</span></div>
      <div class="full"><span class="k">Caja</span><span class="v">${esc(dash(it.caja))}</span></div>
    </div>
    ${txt(it.observacion) ? `<div class="obs"><b>Observación</b>${esc(txt(it.observacion))}</div>` : ""}
  </article>`;
}

function render(){
  const raw = $("#q").value;
  const q = norm(raw).trim();
  $("#clear").style.display = raw ? "block" : "none";
  words = q ? q.split(/\s+/) : [];
  const out = $("#out"), meta = $("#meta");

  if (!q){
    meta.textContent = items.length ? items.length + " repuestos en el inventario" : "";
    out.innerHTML = '<div class="empty"><span class="ico">🔎</span>Escribe arriba para buscar un repuesto.</div>';
    return;
  }
  const res = items.filter(it => words.every(w => it._h.includes(w)));
  if (!res.length){
    meta.textContent = "";
    out.innerHTML = '<div class="empty"><span class="ico">🤷</span>No se encontró ningún repuesto.<br><small>Prueba con menos letras o con otra palabra.</small></div>';
    return;
  }
  meta.textContent = res.length + (res.length === 1 ? " resultado" : " resultados");
  out.innerHTML = res.map(card).join("");
}

async function load(){
  try{
    const r = await fetch("inventario.json?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    items = (d.items || []).map(it => ({...it, _h: norm([it.nombre, it.numero, it.id, it.equipo].join(" "))}));
    $("#upd").textContent = d.actualizado ? "Inventario actualizado: " + d.actualizado : "";
    render();
  }catch(e){
    if (!items.length) $("#out").innerHTML = '<div class="empty"><span class="ico">📡</span>No se pudo cargar el inventario.<br><small>Intenta de nuevo en un momento.</small></div>';
  }
}

/* Arranque */
$("#titulo").innerHTML = CONFIG.titulo;
$("#subtitulo").textContent = CONFIG.subtitulo;
$("#q").placeholder = CONFIG.placeholder;
$("#hint").textContent = CONFIG.ayuda;
document.title = $("#titulo").textContent;

$("#q").addEventListener("input", render);
$("#clear").addEventListener("click", () => { $("#q").value = ""; render(); $("#q").focus(); });
$("#top").addEventListener("click", () => window.scrollTo({top: 0, behavior: "smooth"}));
window.addEventListener("scroll", () => { $("#top").style.display = window.scrollY > 600 ? "block" : "none"; }, {passive: true});
document.addEventListener("click", e => {
  const img = e.target.closest(".photo");
  if (img && img.dataset.full){ $("#zoom img").src = img.dataset.full; $("#zoom").style.display = "flex"; }
  else if (e.target.closest("#zoom")) $("#zoom").style.display = "none";
});
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#zoom").style.display = "none"; });
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(load, CONFIG.refrescarMinutos * 60000);
load();
</script>
</body>
</html>
